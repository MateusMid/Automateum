# Configuração do Automateum. Tokens ficam no .env, nunca aqui.

[painel]
host = "127.0.0.1"
porta = 8765

[obsidian]
# Defina o caminho no config.local.toml (veja config.local.example.toml).
cofre = ""
pasta_diario = "Diário"
# Única pasta (além dos blocos no diário) em que as rotinas escrevem.
pasta_automateum = "Automateum/Saídas"
# Pastas que a busca de tasks ignora: nome solto ou caminho a partir da raiz do cofre.
ignorar = [".obsidian", ".trash", "Automateum/Saídas"]
# Pastas cujas notas mais recentes entram como contexto no briefing do dia.
pastas_contexto = ["FH/Meets"]

[claude]
# Modelo usado nos resumos ("" = padrão do Claude Code).
modelo = "sonnet"
timeout_segundos = 240

[slack]
# "app" lê pela API com o SLACK_TOKEN do .env (padrão). "navegador" roda um coletor externo que lê o
# Slack web com a sua conta logada; as chaves dele ficam no config.local.toml (veja o exemplo).
modo = "app"
# Vazio = todos os canais em que você está. Ou liste só os que importam: ["geral", "dev"] (vale nos dois modos).
canais = []
# Canais em que só entra o que cita você (@seu nome), e só o trecho em volta da citação. O nome vem de
# `meu_nome` ou de `marcas = ["Seu Nome"]`. Só vale no modo "navegador".
# canais_marcados = ["canal-movimentado"]
# DMs e anotações para você mesmo: true (padrão) mantém; false deixa só os canais. Só vale no modo "navegador".
# dms = true
tipos = ["public_channel", "private_channel", "im", "mpim"]
max_conversas = 60

[gmail]
consulta = "in:inbox is:unread newer_than:2d"
max_emails = 40

[reunioes]
# Transcrições do Gutenberg (extensão do Chrome). Ele só salva em Downloads\Gutenberg; a rotina "resumo de
# reuniões" traz cada arquivo para a pasta fixa e resume a reunião no cofre e no diário. A pasta fica no
# config.local.toml (veja o exemplo); `entrada` troca a pasta de onde vêm os arquivos.
pasta = ""
# Reunião de um cliente também vai para a nota do dia (DD-MM.md) da pasta dele no cofre, num bloco do Automateum.
# É do grupo quando todos que falaram (fora "Eu") estão em `pessoas`, ou quando a transcrição cita os termos de
# `palavras` pelo menos `mencoes` vezes (padrão 2). Os nomes ficam no config.local.toml:
# [reunioes.grupos.cliente]
# pasta = "Cliente/Meets"
# pessoas = ["Fulano", "Beltrana"]
# palavras = ["Cliente", "PROJ"]

[github]
# Vazio = tudo que estiver atribuído a você. Ou restrinja: ["org/repo"].
repositorios = []

# Projetos em que você trabalha. O ativar/desativar fica no mapa (gaveta da rotina "prompts das tasks").
# Cada issue aberta de um projeto ativo ganha uma worktree no Orca com o Claude Code e o prompt digitado, sem
# enviar: só sai quando você apertar Enter. `rotulo` limita às issues com essa etiqueta; `max_pendentes` é
# quantos prompts prontos ficam de uma vez; `modelo` troca o texto ({numero}, {titulo}, {url}, {corpo}).
[projetos.automateum]
nome = "Automateum"
github = "MateusMid/Automateum"
ativo = false
max_pendentes = 3

[maquina]
# Discos que aparecem no mapa e no fechamento do dia. Vazio = todos os discos fixos da máquina.
# discos = ["C:", "D:"]

# Sobrescreve o horário de uma rotina, ou desliga com "nunca".
[horarios]
# resumo_mensagens = "cron: 0 9-18 * * 1-5"
# meu_dia = "nunca"
