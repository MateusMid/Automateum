# Configurações específicas desta máquina (não versionado).
# Sobrepõe o que estiver no config.toml.

[obsidian]
# Caminho absoluto para a pasta do seu cofre do Obsidian.
cofre = 'C:\Users\seu_usuario\Documents\SeuCofre'
# pastas_contexto = ["Meets", "Automateum/Saídas/Reuniões"]   # a última: os resumos das reuniões

# Transcrições do Gutenberg: a pasta fixa para onde elas vão, saindo de Downloads\Gutenberg.
# [reunioes]
# pasta = 'C:\Transcricoes'
# [reunioes.grupos.cliente]       # reunião só com gente daqui (ou que cita as palavras) vai também para Cliente/Meets/DD-MM.md
# pasta = "Cliente/Meets"
# pessoas = ["Fulano", "Beltrana"]
# palavras = ["Cliente", "PROJ"]

# Slack pelo navegador, no lugar do app com token. Precisa do coletor de Slack numa pasta fixa
# (a que tem o colher.ps1 e o logar.ps1), de Node, de Python e do Chrome. Rode o logar.ps1 uma vez.
# [slack]
# modo = "navegador"
# kit = 'C:\Users\seu_usuario\.automateum\kit-slack'
# fora = ["Slackbot"]          # conversas que não entram, pelo nome na barra lateral
# time = ""                    # id do workspace, se o coletor não usar o padrão dele
# meu_nome = "Seu Nome"        # suas próprias mensagens não entram no resumo
# dias = 1                     # 1 = hoje e ontem
# timeout_segundos = 2700      # a colheita cheia leva de 1 a 25 minutos
#
# A colheita é longa: use um horário espaçado em vez do padrão de 15 minutos.
# [horarios]
# coletar_slack = "cron: 30 8-18 * * mon-fri"
