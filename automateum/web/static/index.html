<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automateum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151514'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%2374b08f'/%3E%3C/svg%3E">
<!--
  O mapa vivo como editor de fluxo: as camadas ficam em colunas na vertical, da causa ao sintoma,
  e o mapa corre largo na horizontal. Cada fio e uma dependencia que esta no dados/estado.js:
  a ligacao de uma frente com um servico, a rotina com a frente dela, o passo de uma rotina que
  usa um servico, a maquina que roda cada frente e o que esta esperando voce. Nenhum fio e
  desenhado para encher. Seis estilos (teclas 1 a 6). So front: rele dados/estado.js a cada 30 s.

  Dois ritmos de impulso. No vivo, a densidade vem do dado de agora e cada execucao nova que o
  Agendador registra solta um trem pelo caminho da rotina. No espelho, cada impulso e uma rodada
  marcada na agenda real (a 'agenda' de cada rotina no estado.js), num relogio de 10 a 500 vezes
  mais rapido que o de verdade.
-->
<style>
:root {
  --bg: #0c0c0b; --texto: #ecebe6; --mudo: #8d8b84; --linha: rgba(255,248,235,.08); --acc: #74b08f;
  --painel: #151514; --painel2: #1f1f1d;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --fontT: Bahnschrift, "Segoe UI", sans-serif;
  --raio: 10px; --caixa: uppercase; --esp: .12em;
  --ficha-bg: rgba(22,22,21,.95); --ficha-borda: rgba(255,248,235,.14); --ficha-sombra: 0 24px 60px rgba(0,0,0,.6);
  --card: #151514; --card-borda: rgba(255,248,235,.09); --card-raio: 10px; --card-sombra: none; --sel-sombra: 0 28px 64px rgba(0,0,0,.7);
  --porta: #8d8b84; --cab: #7d7b74;
  --bom: #74b08f; --atencao: #d9a440; --ruim: #e5534b; --duvida: #63a6d8; --dele: #a593f2; --desligado: #6d6b65; --construcao: #5f5d57;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--texto); font: 13px/1.45 var(--font);
  display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); overflow: hidden;
  -webkit-font-smoothing: antialiased; transition: background-color .35s, color .35s;
}
button { font: inherit; color: inherit; }

.topo { display: flex; align-items: center; gap: 18px; padding: 10px 20px; border-bottom: 1px solid var(--linha); min-width: 0; }
.marca { flex: none; }
.marca b { display: block; font: 600 15px/1.15 var(--font); letter-spacing: -.005em; }
.marca small { display: block; margin-top: 4px; font: 500 9.5px/1 var(--fontT); letter-spacing: var(--esp); text-transform: uppercase; color: var(--mudo); }
.abas, .demos, .ritmo { display: flex; gap: 2px; padding: 3px; min-width: 0; background: var(--painel); border: 1px solid var(--linha); border-radius: var(--raio); }
.abas { overflow-x: auto; scrollbar-width: none; }
.abas button, .demos a, .ritmo button {
  display: flex; align-items: baseline; gap: 7px; flex: none; padding: 5px 11px 5px 10px; border: 0; border-radius: max(0px, calc(var(--raio) - 3px));
  background: none; color: var(--mudo); cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, color .15s;
}
.abas button:hover, .demos a:hover, .ritmo button:hover { color: var(--texto); }
.abas .k { font: 500 10px/1 var(--fontT); opacity: .75; }
.abas button[aria-selected="true"], .demos a[aria-current], .ritmo button[aria-pressed="true"] { background: var(--painel2); color: var(--texto); box-shadow: inset 0 0 0 1px var(--linha); }
.demos { margin-left: auto; flex: none; }
.demos a { font-size: 12px; padding: 5px 10px; }
/* o ritmo dos impulsos: o de agora, ou o espelho da agenda real acelerado */
.ritmo { flex: none; align-items: center; }
.ritmo .rk { padding: 0 5px 0 7px; font: 500 9.5px/1 var(--fontT); letter-spacing: var(--esp); text-transform: var(--caixa); color: var(--mudo); white-space: nowrap; }
.ritmo button { font-size: 12px; padding: 5px 8px; font-variant-numeric: tabular-nums; }
.vivo { flex: none; display: inline-flex; align-items: center; gap: 8px; color: var(--mudo); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.vivo i { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); animation: vivo 2.4s ease-out infinite; }
@keyframes vivo { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--acc) 55%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }

.barra { display: flex; align-items: center; gap: 20px; padding: 8px 20px; border-bottom: 1px solid var(--linha); min-width: 0; }
.barra .orgs { flex: none; }
.orgs button { font-size: 12px; padding: 4px 9px; }
.barra p { margin: 0; min-width: 0; font-size: 12.5px; color: color-mix(in srgb, var(--texto) 84%, var(--bg)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra small { margin-left: 12px; font-size: 11.5px; color: var(--mudo); }
.barra p.curta small { display: none; }
.leg { margin-left: auto; flex: none; display: flex; gap: 4px 14px; color: var(--mudo); font-size: 11.5px; }
.leg span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.leg i { width: 7px; height: 7px; border-radius: 50%; }
.leg .tr { width: 16px; border-top: 1.5px dashed var(--atencao); }
.leg .rzl { padding: 1px 5px; border-radius: 4px; font: 600 8.5px/1.4 var(--fontT); letter-spacing: .08em; text-transform: uppercase; color: var(--bg); background: var(--mudo); }

.palco { position: relative; overflow: hidden; min-height: 0; touch-action: none; cursor: grab; }
.palco.arrastando { cursor: grabbing; }
#fios, #sobre { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#sobre { z-index: 3; pointer-events: none; }
.mundo { position: absolute; left: 0; top: 0; z-index: 2; transform-origin: 0 0; }
.vazio { margin: 40px 20px; color: var(--mudo); }

/* cabecalho de cada camada */
.col { position: absolute; display: flex; align-items: baseline; gap: 8px; font: 500 10.5px/1 var(--fontT); letter-spacing: .14em; text-transform: uppercase; color: var(--cab); white-space: nowrap; pointer-events: none; }
.col i { font-style: normal; letter-spacing: 0; color: var(--mudo); opacity: .75; }
/* onde a leitura comeca e onde termina: a primeira e a ultima faixa dizem isso por escrito */
.col u { position: absolute; left: 0; bottom: calc(100% + 7px); padding: 2px 6px; border-radius: 4px; font: 600 8.5px/1.3 var(--fontT); letter-spacing: .08em; text-decoration: none; color: var(--bg); background: var(--cab); }

/* os cartoes */
.no {
  position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 5px 11px 5px 12px; min-width: 0;
  background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--card-raio); box-shadow: var(--card-sombra);
  color: var(--texto); cursor: pointer; user-select: none; outline: none; transform-origin: 50% 50%;
  transition: opacity .4s ease, filter .4s ease, border-color .2s, background-color .35s;
  --c: var(--bom); --f: 0;
}
.no::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; box-shadow: 0 0 16px 1px var(--c); opacity: calc(var(--f) * .7); }
.no:hover { border-color: color-mix(in srgb, var(--texto) 36%, transparent); }
.no:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.no .l1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
.no .gl { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.no b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 12.5px/1.25 var(--font); }
.no .tg { margin-left: auto; flex: none; padding-left: 4px; font: 500 10px/1 var(--fontT); letter-spacing: .02em; color: var(--mudo); }
.no .tg.n { letter-spacing: 0; font-variant-numeric: tabular-nums; }
.no .kk { font: 500 9.5px/1 var(--fontT); letter-spacing: var(--esp); text-transform: var(--caixa); color: var(--mudo); margin-bottom: 3px; }
.no .s { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; line-height: 1.3; color: var(--mudo); }
.no .dois, .no .tres { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.no .tres { -webkit-line-clamp: 3; }
.no .dois.mais { -webkit-line-clamp: 4; }
.no .tres.mais { -webkit-line-clamp: 5; }
.no .rz { display: inline-block; margin-right: 5px; vertical-align: 1px; padding: 0 5px; border-radius: 4px; font: 600 8.5px/1.4 var(--fontT); letter-spacing: .08em; text-transform: uppercase; color: var(--bg); background: var(--c); }
.no.prob { border-color: color-mix(in srgb, var(--c) 62%, transparent); }
.no.prob .s { color: var(--c); }
.no.e-desligado b { color: var(--mudo); font-weight: 500; }
.no.e-desligado .gl { background: none; box-shadow: inset 0 0 0 1.5px var(--c); }
.no.k-maquina b { font-size: 15px; }
.no.k-rotina { gap: 1px; padding: 0 10px; }
.no.k-rotina b { font-size: 12px; font-weight: 500; }
.no.k-rotina .s { font-size: 10.5px; }
.no.k-rotina .tg { font-size: 9.5px; }
/* quando um nome de rotina nao cabe ao lado da hora, a hora desce para a linha de baixo em todos os cartoes do estilo */
.hora-sub .no.k-rotina .l1 .tg { display: none; }
.hora-sub .no.k-rotina .s[data-t]::before { content: attr(data-t); }
.no.k-voce b.dois, .no.k-voce b.tres { font-size: 12px; line-height: 1.3; }
/* as lojas de dentro do cartao: um tracinho por loja, para nao parecer porta de fio */
.no .mic { display: flex; gap: 2px; margin-top: 4px; }
.no .mic i { flex: 1 1 0; max-width: 12px; height: 3px; border-radius: 2px; background: var(--c); }
.no .mic i.e-desligado { background: none; box-shadow: inset 0 0 0 1px var(--c); }
.pt { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--card); border: 1.4px solid var(--porta); pointer-events: none; }
.pt.p { border-color: var(--c); }
.no.apagado { opacity: .13; filter: saturate(.3); }
.no.sel { z-index: 5; box-shadow: var(--sel-sombra); transition: opacity .4s ease, filter .4s ease; }
.no.sel::after { opacity: .55; }
.e-bom { --c: var(--bom); } .e-atencao { --c: var(--atencao); } .e-ruim { --c: var(--ruim); } .e-duvida { --c: var(--duvida); }
.e-dele { --c: var(--dele); } .e-desligado { --c: var(--desligado); } .e-construcao { --c: var(--construcao); }

/* a orbita: o que o no clicado tem dentro, aberto em volta dele */
.orb { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.pil {
  position: absolute; left: 0; top: 0; display: flex; align-items: flex-start; gap: 7px; max-width: 330px; padding: 4px 10px 4px 9px;
  background: var(--painel2); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); border-radius: min(12px, var(--card-raio));
  color: var(--texto); font-size: 11.5px; line-height: 1.3; box-shadow: 0 8px 22px rgba(0,0,0,.28);
  opacity: 0; pointer-events: auto; will-change: transform, opacity; transform-origin: 0 0;
}
button.pil { cursor: pointer; }
button.pil:hover { border-color: var(--c); }
.pil i { flex: none; width: 6px; height: 6px; margin-top: 4.5px; border-radius: 50%; background: var(--c); }
/* o rotulo fica inteiro; o valor quebra em ate tres linhas em vez de sumir na reticencia */
.pil b { flex: none; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.pil span { min-width: 0; overflow: hidden; color: var(--mudo); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.pil.prob b { color: var(--c); }

/* a ficha do que foi clicado */
.ficha {
  position: absolute; right: 18px; bottom: 16px; z-index: 6; width: 330px; padding: 14px 16px 13px;
  background: var(--ficha-bg); border: 1px solid var(--ficha-borda); border-radius: var(--raio); box-shadow: var(--ficha-sombra);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); cursor: default;
  opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.2, .8, .2, 1);
}
.ficha.on { opacity: 1; transform: none; pointer-events: auto; }
.ficha.esq { right: auto; left: 18px; bottom: 58px; }
.ficha.cima { bottom: auto; top: 14px; }
.ficha .k { margin: 0; padding-right: 26px; font: 500 10px/1.2 var(--fontT); letter-spacing: var(--esp); text-transform: var(--caixa); color: var(--mudo); }
.ficha h2 { margin: 6px 0 0; font: 600 17px/1.25 var(--font); }
.ficha .st { display: flex; align-items: center; gap: 7px; margin: 6px 0 0; font-size: 12px; color: var(--mudo); }
.ficha .st i { width: 8px; height: 8px; border-radius: 50%; }
.ficha .fr { margin: 8px 0 0; font-size: 12.5px; line-height: 1.45; }
.ficha dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; padding-top: 9px; border-top: 1px solid var(--linha); font-size: 12px; }
.ficha dt { color: var(--mudo); }
.ficha dd { margin: 0; min-width: 0; }
.ficha .x { position: absolute; top: 8px; right: 9px; width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--mudo); cursor: pointer; font-size: 17px; line-height: 1; }
.ficha .x:hover { color: var(--texto); background: var(--painel2); }

/* zoom e mapa pequeno */
.zoom { position: absolute; left: 16px; bottom: 14px; z-index: 6; display: flex; gap: 2px; padding: 3px; background: var(--painel); border: 1px solid var(--linha); border-radius: var(--raio); cursor: default; }
.zoom button { min-width: 28px; height: 26px; padding: 0 9px; border: 0; border-radius: max(0px, calc(var(--raio) - 3px)); background: none; color: var(--mudo); cursor: pointer; font-size: 12px; }
.zoom button:hover { color: var(--texto); background: var(--painel2); }
.zoom .dica { align-self: center; padding: 0 8px 0 7px; font-size: 11px; color: var(--mudo); white-space: nowrap; }
.mini { position: absolute; left: 16px; bottom: 56px; z-index: 6; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--painel); opacity: 0; pointer-events: none; transition: opacity .25s; cursor: pointer; }
.mini.on { opacity: .96; pointer-events: auto; }

/* Estudio: a borda acende na cor do tipo, como no editor de fluxo */
.t-estudio .no { --tipo: #38bdf8; border: 1.5px solid color-mix(in srgb, var(--tipo) 68%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--tipo) 20%, transparent), inset 0 1px 0 rgba(255,255,255,.04); }
.t-estudio .no.k-frente, .t-estudio .no.k-rotina { --tipo: #a78bfa; }
.t-estudio .no.k-voce { --tipo: #34d399; }
.t-estudio .no.prob { --tipo: var(--c); }
.t-estudio .no.e-desligado { --tipo: #5b616e; box-shadow: none; }
.t-estudio .no.sel { box-shadow: var(--sel-sombra), 0 0 22px color-mix(in srgb, var(--tipo) 40%, transparent); }
/* Malha: o icone de estado no lugar do ponto, com o certo e o alerta */
.t-malha .no:not(.k-rotina) .gl { position: relative; width: 13px; height: 13px; }
.t-malha .no:not(.k-rotina) .gl::after { content: ""; position: absolute; left: 4.6px; top: 2.4px; width: 3px; height: 6px; border: solid #0a0f1c; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
.t-malha .no.prob:not(.k-rotina) .gl::after { content: "!"; left: 0; top: 0; width: 13px; height: 13px; border: 0; transform: none; text-align: center; font: 800 9.5px/13px var(--font); color: #0a0f1c; }
.t-malha .no.e-desligado .gl::after { display: none; }
/* Neon */
.t-neon .no::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px; background: #ff2bd6; box-shadow: 0 0 8px #ff2bd6; }
.t-neon .no.prob::before { background: var(--c); box-shadow: 0 0 8px var(--c); }
.t-neon .no b { letter-spacing: .02em; }
.t-neon .no.prob b { animation: falha 3.4s steps(1) infinite; }
.t-neon .col { text-shadow: 0 0 10px rgba(255,43,214,.55); }
.t-neon .marca b { text-transform: uppercase; letter-spacing: .06em; }
@keyframes falha { 0%, 87%, 100% { text-shadow: none; transform: none; } 89% { text-shadow: -2px 0 #00f0ff, 2px 0 #ff2bd6; transform: translateX(1px); } 92% { text-shadow: 2px 0 #00f0ff, -2px 0 #ff2bd6; transform: translateX(-1px); } }
/* Holograma: cantoneiras no lugar da borda inteira */
.t-holograma .no::before {
  content: ""; position: absolute; inset: -3px; pointer-events: none; --k: color-mix(in srgb, var(--c) 85%, transparent);
  background:
    linear-gradient(var(--k), var(--k)) 0 0 / 8px 1.5px, linear-gradient(var(--k), var(--k)) 0 0 / 1.5px 8px,
    linear-gradient(var(--k), var(--k)) 100% 0 / 8px 1.5px, linear-gradient(var(--k), var(--k)) 100% 0 / 1.5px 8px,
    linear-gradient(var(--k), var(--k)) 0 100% / 8px 1.5px, linear-gradient(var(--k), var(--k)) 0 100% / 1.5px 8px,
    linear-gradient(var(--k), var(--k)) 100% 100% / 8px 1.5px, linear-gradient(var(--k), var(--k)) 100% 100% / 1.5px 8px;
  background-repeat: no-repeat;
}
.t-holograma .no b { font-size: 11px; font-weight: 500; }
.t-holograma .no.k-maquina b { font-size: 14px; }
.t-holograma .no.k-rotina b { font-size: 11px; }
.t-holograma .no .s { font-size: 10px; }
.t-holograma .col { letter-spacing: .05em; }
.t-holograma .col::before { content: "[" attr(data-n) "]"; margin-right: 2px; }
/* Claro */
.t-claro .no.prob { background: color-mix(in srgb, var(--c) 6%, #ffffff); }
.t-claro .pil { box-shadow: 0 6px 18px rgba(40,34,20,.12); }

@media (prefers-reduced-motion: reduce) {
  .ficha, .no, .mini { transition: none; }
  .vivo i, .t-neon .no.prob b { animation: none; }
}
</style>
<link rel="stylesheet" href="/static/extras.css">
</head>
<body>
<header class="topo">
  <div class="marca"><b>Automateum</b><small>seis estilos, cinco organizações</small></div>
  <nav class="abas" id="abas" role="tablist" aria-label="Estilos"></nav>
  <div class="ritmo" id="ritmo" role="group" aria-label="Ritmo dos impulsos"><span class="rk">impulsos</span></div>
  <span class="vivo" id="vivo"><i></i>dados de agora</span>
  <button type="button" class="gv-chip" data-gv-saude title="O mapa está certo? Clique para conferir."></button>
</header>
<div class="barra"><nav class="abas orgs" id="orgs" role="tablist" aria-label="Organização"></nav><p id="desc"></p><div class="leg" id="leg"></div></div>
<section class="hoje" id="hoje" aria-label="Hoje"></section>
<main class="palco" id="palco">
  <canvas id="fios" aria-hidden="true"></canvas>
  <div class="mundo" id="mundo"></div>
  <canvas id="sobre" aria-hidden="true"></canvas>
  <div class="orb" id="orb"></div>
  <aside class="ficha" id="ficha" aria-live="polite"></aside>
  <canvas class="mini" id="mini" aria-hidden="true"></canvas>
  <div class="zoom" id="zoom"><span class="dica">arraste para mover · a roda aproxima</span><button type="button" data-z="-" aria-label="Afastar">−</button><button type="button" data-z="fit">Encaixar</button><button type="button" data-z="+" aria-label="Aproximar">+</button></div>
</main>
<div class="celular" id="celular"></div>
<button type="button" id="sair-parede">Sair do modo painel</button>
<script src="/dados/estado.js"></script>
<script src="/static/extras.js"></script>
<script src="/static/gaveta.js"></script>
<script>
(function () {
  'use strict';
  function $(s) { return document.querySelector(s); }
  var palco = $('#palco'), fios = $('#fios'), ctx = fios.getContext('2d'), sobre = $('#sobre'), ctx2 = sobre.getContext('2d');
  var mundo = $('#mundo'), orb = $('#orb'), ficha = $('#ficha'), abas = $('#abas'), mini = $('#mini'), mctx = mini.getContext('2d');
  var reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = Math.PI * 2;
  var NOME = {ruim: 'quebrado', duvida: 'dúvida', atencao: 'atenção', dele: 'com você', bom: 'em dia', desligado: 'desligado', construcao: 'em construção'};
  var PROB = {ruim: 1, duvida: 1, atencao: 1, dele: 1};
  var GRAV = {ruim: 5, duvida: 4, atencao: 3, dele: 2, bom: 1, desligado: 0, construcao: 0};

  function est(e) { return NOME[e] ? e : 'construcao'; }

    ritmoEl.appendChild(b);
  });
  ritmoEl.addEventListener('click', function (ev) { var b = ev.target.closest('[data-x]'); if (b) mudarRitmo(+b.getAttribute('data-x')); });

  // os impulsos que estavam no caminho seguem no mapa novo, no mesmo fio; o que sumiu, some junto
  function remapear(velhos) {
    var por = {};
    G.arestas.forEach(function (e) { por[e.a.id + '>' + e.b.id] = e; });
    function achar(e) { return por[e.a.id + '>' + e.b.id]; }
    return velhos.filter(function (p) {
      var e = achar(p.e);
      if (!e) return false;
      var seg = [];
      for (var i = 0; p.seg && i < p.seg.length; i++) { var s = achar(p.seg[i]); if (!s) break; seg.push(s); }
      p.e = e; p.seg = seg;
      return true;
    });
  }
  // a execucao nova: a ultima vez de uma rotina subiu desde a leitura anterior
  function trens(antes) {
    if (ritmo) return;
    G.rotinas.forEach(function (n) {
      if (n.id in antes && (n.x.ultima || '') > antes[n.id]) trem(n);
    });
  }
  // o trem de uma rotina, contado no palco para a prova ver de fora que a execucao virou impulso
  function trem(n) {
    disparar(rotas(n), true);
    palco.dataset.trens = (+palco.dataset.trens || 0) + 1;
    palco.dataset.tremDe = n.id;
  }
  // o motor regrava o estado a cada 5 min; a pagina rele e troca a rede sem recarregar
  function recarregar() {
    var s = document.createElement('script');
    s.src = '/dados/estado.js?t=' + Date.now();
    s.onload = function () {
      s.remove();
      var novo = window.MAPA;
      if (!novo || !novo.nos || (M && novo.gerado === M.gerado)) return;
      var id = ativo() && sel.id, antes = {}, velhos = pulsos;
      G.nos.forEach(function (n) { if (n.tipo === 'rotina') antes[n.id] = n.x.ultima || ''; });
      soltar(); focoAlvo = 0; ficha.classList.remove('on');
      M = novo; G = montar(M); separar(); construir(); dispor();
      if (window.Gaveta) Gaveta.receber(M);
      pulsos = remapear(velhos);
      if (encaixado) encaixar(false);
      if (id && G.por[id]) selecionar(G.por[id]);
      if (ritmo) agendar();
      vivo(); barra();
      document.dispatchEvent(new Event('mapa:atualizado'));
      var g = G;
      setTimeout(function () { if (G === g) trens(antes); }, 400);
    };
    s.onerror = function () { s.remove(); };
    document.head.appendChild(s);
  }

  var orgsEl = $('#orgs'), TECLA_ORG = ['q', 'w', 'e', 'r', 't'];
  orgsEl.innerHTML = ORGS.map(function (o, i) {
    return '<button type="button" role="tab" data-o="' + i + '" title="' + esc(o.desc) + '"><span class="k">' + TECLA_ORG[i].toUpperCase() + '</span>' + esc(o.nome) + '</button>';
  }).join('');
  function organizarEm(i) {
    org = i;
    [].forEach.call(orgsEl.children, function (b, k) { b.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
    try { localStorage.setItem('fluxo.org', String(i)); } catch (e) { /* sem armazenamento */ }
    if (!G) return;
    var id = ativo() && sel.id, velhos = pulsos;
    soltar(); focoAlvo = 0; ficha.classList.remove('on');
    G = montar(M); separar(); construir(); dispor();
    pulsos = remapear(velhos);
    encaixar(false);
    if (id && G.por[id]) selecionar(G.por[id]);
    if (ritmo) agendar();
    barra();
  }
  orgsEl.addEventListener('click', function (ev) { var b = ev.target.closest('[data-o]'); if (b) organizarEm(+b.getAttribute('data-o')); });
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.altKey || ev.metaKey || (ev.target && ev.target.closest && ev.target.closest('input, textarea'))) return;
    var i = TECLA_ORG.indexOf(String(ev.key).toLowerCase());
    if (i >= 0) organizarEm(i);
  });
  try { org = parseInt(localStorage.getItem('fluxo.org'), 10) || 0; } catch (e) { org = 0; }
  if (!(org >= 0 && org < ORGS.length)) org = 0;
  [].forEach.call(orgsEl.children, function (b, k) { b.setAttribute('aria-selected', k === org ? 'true' : 'false'); });

  var salvo = 0;
  try { salvo = parseInt(localStorage.getItem('fluxo.estilo'), 10) || 0; } catch (e) { /* sem armazenamento */ }
  aplicar(salvo >= 0 && salvo < TEMAS.length ? salvo : 0);
  if (!M || !M.nos) { palco.innerHTML = '<p class="vazio">O dados/estado.js não carregou: abra esta página de dentro da pasta do mapa.</p>'; return; }
  // o endereco escolhe o cartao: mapa.html#<id> abre com aquele cartao aceso
  function doEndereco() {
    var id = decodeURIComponent(location.hash.slice(1));
    if (id && G && G.por[id] && G.por[id] !== ativo()) selecionar(G.por[id]);
  }
  window.addEventListener('hashchange', doEndereco);
  G = montar(M); separar(); construir();
  medir();
  window.MapaTela = {medir: medir};
  document.dispatchEvent(new Event('mapa:atualizado'));
  // a gaveta e a mesma das quatro paginas; clicar numa linha dela acende o cartao correspondente aqui
  if (window.Gaveta) {
    Gaveta.iniciar({encolher: '#palco', ancora: '#palco',
      aoAgir: function (acao, est) { if (est === 'ok' && /^(motor|projeto-ligar|projeto-desligar|projeto-comecar|projeto-refazer):/.test(acao)) setTimeout(recarregar, 300); },
      aoAbrir: function (id) { if (id && G && G.por[id] && G.por[id] !== ativo()) selecionar(G.por[id]); },
      aoFechar: function () { selecionar(null); }});
    Gaveta.receber(M);
  }
  var rs = 0;
  try { rs = parseInt(localStorage.getItem('fluxo.ritmo'), 10) || 0; } catch (e) { /* sem armazenamento */ }
  mudarRitmo(rs);
  doEndereco();
  new ResizeObserver(medir).observe(palco);
  new ResizeObserver(caber).observe($('.barra'));
  requestAnimationFrame(quadro);
  setInterval(recarregar, 30000);
  // na primeira carga, a rotina que rodou nos ultimos 5 min solta o trem dela
  setTimeout(function () {
    if (ritmo) return;
    var agora = Date.now();
    G.rotinas.forEach(function (n) {
      var u = n.x.ultima ? Date.parse(n.x.ultima) : NaN;
      if (u <= agora && agora - u < 5 * 6e4) trem(n);
    });
  }, 600);
})();
</script>
</body>
</html>
