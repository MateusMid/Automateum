<!doctype html>

<main id="palco" aria-label="Mapa das rotinas">
  <div id="mundo">
    <svg id="fios" aria-hidden="true"></svg>
  </div>
</main>

<nav id="controles" aria-label="Zoom">
  <span>arraste para mover · a roda aproxima</span>
  <button id="menos" aria-label="Afastar">−</button>
  <button id="encaixar">Encaixar</button>
  <button id="mais" aria-label="Aproximar">+</button>
</nav>

<aside id="gaveta" hidden aria-label="Detalhes">
  <button id="fechar" aria-label="Fechar">×</button>
  <div id="gaveta-corpo"></div>
</aside>

<script src="/static/painel.js"></script>
